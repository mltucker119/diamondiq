<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond IQ - Full Playbook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div class="header glass">
            <h1>Diamond IQ</h1>
            <div class="scenario-meta">
                <span id="situation-tag" class="badge">Bases Empty, 0 Outs</span>
                <p id="scenario-text">Level 1: Ground Ball to Pitcher</p>
            </div>
        </div>
        <div class="controls glass">
            <select id="scenario-select" class="btn select-box" onchange="loadScenario(this.value)">
                <option value="0">Scenario 1: Grounder to P</option>
                <option value="1">Scenario 2: Force at 2nd</option>
                <option value="2">Scenario 3: Fly Ball to RF</option>
                <option value="3">Scenario 4: Single to LF (Cutoffs)</option>
                <option value="4">Scenario 5: Bunt Coverage (Rotation)</option>
                <option value="5">Scenario 6: Grounder to 1B (3-1 Play)</option>
                <option value="6">Scenario 7: Fly Ball to LF</option>
                <option value="7">Scenario 8: Force at 3rd</option>
                <option value="8">Scenario 9: Steal Attempt at 2nd</option>
                <option value="9">Scenario 10: Sac Fly to LF (Tag Up)</option>
            </select>
            <button class="btn reset" onclick="resetField()">RESET</button>
            <button class="btn solution" onclick="showSolution()">SOLUTION</button>
            <button class="btn submit" onclick="checkWork()">SUBMIT</button>
        </div>
    </div>

    <div id="feedback-modal" class="hidden">
        <div class="modal-content">
            <h2 id="feedback-title"></h2>
            <div id="feedback-msg"></div>
            <button class="btn reset close-btn" onclick="closeModal()">Return to Field</button>
        </div>
    </div>

    <canvas id="fieldCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
