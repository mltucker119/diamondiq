<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond IQ - Base Runner Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div class="header">
            <h1>Diamond IQ</h1>
            <div class="scenario-meta">
                <span id="situation-tag" class="badge">Bases Empty, 0 Outs</span>
                <p id="scenario-text">Level 1: Ground Ball to Pitcher</p>
            </div>
        </div>
        <div class="controls">
            <select id="scenario-select" class="btn select-box" onchange="loadScenario(this.value)">
                <option value="0">Scenario 1: Grounder to P</option>
                <option value="1">Scenario 2: Force at 2nd</option>
            </select>
            <button class="btn reset" onclick="resetField()">RESET</button>
            <button class="btn solution" onclick="showSolution()">SOLUTION</button>
            <button class="btn submit" onclick="checkWork()">SUBMIT</button>
        </div>
    </div>

    <div id="feedback-modal" class="hidden">
        <h2 id="feedback-title"></h2>
        <div id="feedback-msg"></div>
        <button class="btn reset close-btn" onclick="closeModal()">Return to Field</button>
    </div>

    <canvas id="fieldCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
